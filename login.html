<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In · Media Core Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="vibrant-bg"></div>
  <canvas id="orbit-canvas" style="opacity:0.4;"></canvas>

  <div class="black-hole-container" style="transform:translate(-50%,-50%) scale(0.6); opacity:0.5; pointer-events:none;">
    <div class="gravity-lens"></div>
    <div class="horizon-ring outer"></div>
    <div class="horizon-ring middle"></div>
    <div class="horizon-ring inner"></div>
    <div class="singularity"></div>
  </div>

  <nav class="nav-glass" id="navGlass" style="opacity:1; transform:translateX(-50%) translateY(0);">
    <div class="nav-logo-glass" onclick="window.location.href='index.html'">MC</div>
    <div class="nav-links-glass">
      <a href="index.html">Home</a>
      <a href="ideas.html">Ideas</a>
      <a href="shop.html">Shop</a>
      <a href="assignments.html">Assignments</a>
    </div>
      <div style="display:flex; align-items:center; gap:10px;"><div class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme"></div></div>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">MC</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your Media Core Hub account</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email or username</label>
          <input type="text" class="form-input" id="loginEmail" placeholder="you@example.com" required />
          <p class="form-hint" id="emailHint"></p>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required />
          <p class="form-hint" id="passwordHint"></p>
        </div>

        <div class="form-options">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" onclick="showToast('Contact your teacher to reset password', 'info'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="btn-full primary" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
        </button>
      </form>

      <div class="auth-divider">or continue with</div>

      <button class="social-btn" onclick="showToast('Demo: School login not configured', 'warning');">
        <span>🎓</span> School Account
      </button>

      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    function applyTheme() {
      document.body.setAttribute('data-theme', getTheme());
    }
    applyTheme();
    function toggleTheme() {
      const next = getTheme() === 'dark' ? 'light' : 'dark';
      setTheme(next);
      applyTheme();
      showToast(`${next === 'dark' ? '🌙' : '☀️'} Switched to ${next} mode`, 'info');
    }

    function showToast(message, type = 'info', duration = 3000) {
      const container = document.getElementById('toastContainer');
      const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, duration);
    }

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      document.getElementById('loginEmail').classList.remove('error');
      document.getElementById('loginPassword').classList.remove('error');
      document.getElementById('emailHint').textContent = '';
      document.getElementById('passwordHint').textContent = '';

      if (!email) {
        document.getElementById('loginEmail').classList.add('error');
        document.getElementById('emailHint').textContent = 'Please enter your email or username';
        document.getElementById('emailHint').className = 'form-hint error';
        return;
      }
      if (!password) {
        document.getElementById('loginPassword').classList.add('error');
        document.getElementById('passwordHint').textContent = 'Please enter your password';
        document.getElementById('passwordHint').className = 'form-hint error';
        return;
      }

      loginBtn.disabled = true;
      loginBtnText.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:8px;"></span> Signing in...';

      try {
        const data = await AuthAPI.login({ email, password });
        setToken(data.token);
        setUser(data.user);
        showToast(`Welcome back, ${data.user.name}! 🎉`, 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1200);
      } catch (err) {
        loginBtn.disabled = false;
        loginBtnText.textContent = 'Sign In';
        document.getElementById('loginPassword').classList.add('error');
        document.getElementById('passwordHint').textContent = err.message || 'Invalid email or password';
        document.getElementById('passwordHint').className = 'form-hint error';
        showToast(err.message || 'Invalid credentials', 'error');
      }
    });

    document.getElementById('loginEmail').addEventListener('input', function() {
      this.classList.remove('error');
      document.getElementById('emailHint').textContent = '';
    });
    document.getElementById('loginPassword').addEventListener('input', function() {
      this.classList.remove('error');
      document.getElementById('passwordHint').textContent = '';
    });

    // Subtle orbit particles
    const orbitCanvas = document.getElementById('orbit-canvas');
    const orbitCtx = orbitCanvas.getContext('2d');
    let orbitParticles = [];

    function resizeOrbit() { orbitCanvas.width = window.innerWidth; orbitCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeOrbit);
    resizeOrbit();

    for (let i = 0; i < 40; i++) {
      orbitParticles.push({
        angle: Math.random() * Math.PI * 2, distance: 200 + Math.random() * 300,
        speed: 0.001 + Math.random() * 0.004, size: 0.5 + Math.random() * 1.5,
        color: ['#ff9bf9', '#9bb6ff', '#8bffe0', '#ffffff'][Math.floor(Math.random() * 4)],
        alpha: 0.2 + Math.random() * 0.3, trail: [], maxTrail: 5 + Math.floor(Math.random() * 8)
      });
    }

    function orbitLoop() {
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      orbitCtx.clearRect(0, 0, orbitCanvas.width, orbitCanvas.height);
      orbitParticles.forEach(p => {
        p.angle += p.speed;
        const x = cx + Math.cos(p.angle) * p.distance;
        const y = cy + Math.sin(p.angle) * p.distance;
        p.trail.push({ x, y });
        if (p.trail.length > p.maxTrail) p.trail.shift();
        if (p.trail.length > 1) {
          orbitCtx.beginPath(); orbitCtx.moveTo(p.trail[0].x, p.trail[0].y);
          for (let i = 1; i < p.trail.length; i++) orbitCtx.lineTo(p.trail[i].x, p.trail[i].y);
          orbitCtx.strokeStyle = p.color; orbitCtx.lineWidth = p.size * 0.3;
          orbitCtx.globalAlpha = p.alpha * 0.2; orbitCtx.stroke();
        }
        const head = p.trail[p.trail.length - 1];
        if (head) {
          orbitCtx.globalAlpha = p.alpha; orbitCtx.fillStyle = p.color;
          orbitCtx.beginPath(); orbitCtx.arc(head.x, head.y, p.size, 0, Math.PI * 2); orbitCtx.fill();
        }
      });
      orbitCtx.globalAlpha = 1;
      requestAnimationFrame(orbitLoop);
    }
    orbitLoop();
  </script>
</body>
</html>
